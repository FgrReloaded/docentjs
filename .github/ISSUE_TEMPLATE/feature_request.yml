name: Idea or feature request
description: Suggest something Docent should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does Docent get in the way? Describe the situation rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. If it would be a new field in the tour JSON, sketch it here.
      render: json
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Slots, templates, headless mode, your own CSS — and why it was not enough.
